name: Publicar sitio en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Reconstruye cada hora en punto (hora UTC) — así, un artículo/insight/dato
  # programado con fecha futura se publica solo cuando esa fecha llega, sin
  # que nadie tenga que entrar a publicarlo manualmente. Si una corrida
  # llegara a fallar, la siguiente (una hora después) lo publica de todos
  # modos — nunca se pierde un día completo por una sola falla.
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir el sitio
        run: npm run build

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio construido
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
