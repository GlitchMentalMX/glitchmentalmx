name: Actualizar tipo de cambio Banxico

# Corre dos veces al día — 15:00 y 19:00 hora CDMX (21:00 y 01:00 UTC) — no
# porque Banxico publique dos veces, sino porque se confirmó (24 ago 2026)
# que el endpoint REST /datos/oportuno de la API SIE a veces sigue
# devolviendo el dato del día hábil anterior varias horas después de que el
# sitio público de Banxico ya muestra el FIX del día — un rezago propio de
# esa API, no un patrón confiable. La corrida de las 19:00 es el respaldo:
# si la de las 15:00 encontró el dato viejo, la de la tarde casi siempre ya
# alcanza el nuevo. Fin de semana/festivo: Banxico no publica dato nuevo, el
# script deja el archivo igual y ninguna de las dos corridas genera commit.
on:
  schedule:
    - cron: '0 21 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Consultar Banxico y actualizar el archivo
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: node scripts/actualizar-tipo-cambio.mjs

      - name: Publicar el cambio (si hubo uno)
        run: |
          if git diff --quiet -- src/data/tipo-cambio.json; then
            echo "Sin cambios en tipo-cambio.json — no hay nada que subir."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/tipo-cambio.json
          git commit -m "Actualizar tipo de cambio Banxico"
          git push
