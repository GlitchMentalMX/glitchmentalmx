name: Actualizar tipo de cambio Banxico

# Corre a las 15:12 y, de respaldo, a las 17:43 hora CDMX (21:12 y 23:43
# UTC) — a propósito NO en punto de hora. GitHub documenta que los triggers
# "schedule" se pueden retrasar o saltar por completo en horas de más carga,
# y la hora en punto es la más congestionada de todas (todo mundo programa
# ahí). Confirmado el 26 ago 2026: la corrida de ese día simplemente no
# disparó — no fue error nuestro ni de Banxico, fue GitHub saltándose el
# cron. La segunda corrida de la tarde es la red de seguridad: si la de
# las 15:12 no dispara, casi seguro la de las 17:43 sí. Ninguna genera
# commit si no hay dato nuevo (fin de semana/festivo incluido).
#
# 24 ago 2026: se descubrió y corrigió un bug real — el commit de este
# workflow, al usar el token automático, no disparaba la publicación del
# sitio (GitHub bloquea a propósito que un push de github-actions[bot]
# encadene otro workflow, para evitar loops). Ver el paso "Disparar la
# publicación del sitio" más abajo — ya no depende de que pase otra cosa.
on:
  schedule:
    - cron: '12 21 * * *'
    - cron: '43 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Consultar Banxico y actualizar el archivo
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: node scripts/actualizar-tipo-cambio.mjs

      - name: Publicar el cambio (si hubo uno)
        id: publicar
        run: |
          if git diff --quiet -- src/data/tipo-cambio.json; then
            echo "Sin cambios en tipo-cambio.json — no hay nada que subir."
            echo "cambio=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/tipo-cambio.json
          git commit -m "Actualizar tipo de cambio Banxico"

          # Este repo recibe commits seguido (tú, el CMS). Si alguien sube
          # algo a main justo entre que este workflow descargó el código y
          # este paso hace push, git rechaza el push por estar desactualizado
          # — pasó el 27 ago 2026. En vez de morir ahí, se sincroniza y
          # reintenta un par de veces antes de darse por vencido.
          for intento in 1 2 3; do
            if git push; then
              echo "cambio=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rechazado (intento $intento) — sincronizando con origin y reintentando…"
            git pull --rebase origin main
          done
          echo "No se pudo subir el cambio tras varios intentos."
          exit 1

      # GitHub, a propósito, no deja que un push hecho con el token automático
      # de este mismo workflow dispare el workflow de "push" que publica el
      # sitio (es una protección anti-loops) — así que sin este paso, el
      # commit de arriba se queda en el repositorio pero el sitio publicado
      # nunca se entera y no se reconstruye solo. Este paso dispara ese
      # workflow directamente, a propósito, solo cuando sí hubo un cambio real.
      - name: Disparar la publicación del sitio
        if: steps.publicar.outputs.cambio == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
