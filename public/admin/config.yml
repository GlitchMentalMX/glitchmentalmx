backend:
  name: github
  repo: GlitchMentalMX/glitchmentalmx
  branch: main
  base_url: https://glitchmentalmx.contacto-fbf.workers.dev
  auth_endpoint: auth

site_url: https://glitchmental.com
display_url: https://glitchmental.com

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

slug:
  encoding: "unicode"
  clean_accents: true
  sanitize_replacement: "-"

locale: "es"

collections:
  - name: "posts"
    label: "Artículos"
    label_singular: "Artículo"
    folder: "src/content/posts"
    create: true
    slug: "{{title}}"
    identifier_field: title
    sortable_fields:
      fields: ["pubDate", "title"]
      default:
        field: "pubDate"
        direction: "descending"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha de publicación", name: "pubDate", widget: "datetime" }
      - { label: "Fecha de actualización", name: "updatedDate", widget: "datetime", required: false }
      - { label: "Descripción (para tarjetas y buscadores)", name: "description", widget: "text" }
      - { label: "Imagen principal", name: "heroImage", widget: "image" }
      - { label: "Texto alternativo de la imagen principal", name: "heroImageAlt", widget: "string" }
      - { label: "Borrador (no publicar todavía)", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "Cuerpo del artículo", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Páginas fijas"
    label_singular: "Página"
    files:
      - name: "acerca-de"
        label: "Acerca de"
        file: "src/content/pages/acerca-de.md"
        fields: &pageFields
          - { label: "Título (pestaña del navegador)", name: "title", widget: "string" }
          - { label: "Descripción (buscadores)", name: "description", widget: "text" }
          - { label: "Etiqueta pequeña arriba del título", name: "eyebrow", widget: "string" }
          - { label: "Título grande", name: "headline", widget: "string" }
          - { label: "Bajada / subtítulo", name: "dek", widget: "text", required: false }
          - { label: "Cuerpo de la página", name: "body", widget: "markdown" }
      - name: "contacto"
        label: "Contacto"
        file: "src/content/pages/contacto.md"
        fields: *pageFields
      - name: "suscribete"
        label: "Suscríbete"
        file: "src/content/pages/suscribete.md"
        fields: *pageFields
      - name: "colabora"
        label: "Colabora"
        file: "src/content/pages/colabora.md"
        fields: *pageFields
      - name: "publicidad"
        label: "Publicidad"
        file: "src/content/pages/publicidad-en-glitchmentalmx.md"
        fields: *pageFields
      - name: "servicios-editoriales"
        label: "Servicios Editoriales (ES)"
        file: "src/content/pages/servicios-editoriales-glitchmentalmx.md"
        fields: *pageFields
      - name: "editorial-services"
        label: "Editorial Services (EN)"
        file: "src/content/pages/editorial-services-glitchmentalmx.md"
        fields: *pageFields
      - name: "politica-de-privacidad"
        label: "Política de Privacidad"
        file: "src/content/pages/politica-de-privacidad.md"
        fields: *pageFields
      - name: "aviso-legal"
        label: "Aviso Legal"
        file: "src/content/pages/aviso-legal-y-condiciones-de-uso.md"
        fields: *pageFields
      - name: "gracias"
        label: "Gracias (bienvenida a suscriptores)"
        file: "src/content/pages/gracias.md"
        fields: *pageFields

  - name: "insights_visuales"
    label: "Insights Visuales"
    label_singular: "Insight visual"
    folder: "src/content/insights"
    create: true
    slug: "{{titulo}}"
    identifier_field: titulo
    sortable_fields:
      fields: ["date", "titulo"]
      default:
        field: "date"
        direction: "descending"
    fields:
      - { label: "Título", name: "titulo", widget: "string" }
      - { label: "Resumen", name: "resumen", widget: "text" }
      - { label: "Imagen", name: "imagen", widget: "image" }
      - { label: "Enlace al artículo relacionado (ej. /articulos/mi-articulo/)", name: "enlace", widget: "string", required: false }
      - { label: "Fecha (el más reciente es el que aparece en el home)", name: "date", widget: "datetime", default: "" }

  - name: "dato_incomodo"
    label: "Dato Incómodo"
    label_singular: "Dato incómodo"
    folder: "src/content/dato-incomodo"
    create: true
    slug: "dato-{{uuid_short}}"
    identifier_field: resumen
    sortable_fields:
      fields: ["date", "titulo"]
      default:
        field: "date"
        direction: "descending"
    fields:
      - { label: "Título (interno, siempre dice 'Dato Incómodo')", name: "titulo", widget: "string", default: "Dato Incómodo" }
      - { label: "El dato (texto que se muestra)", name: "resumen", widget: "text" }
      - { label: "Imagen", name: "imagen", widget: "image" }
      - { label: "Fecha (el más reciente es el que aparece primero)", name: "date", widget: "datetime", default: "" }
