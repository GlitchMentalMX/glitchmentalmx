backend:
  name: github
  repo: GlitchMentalMX/glitchmentalmx
  branch: main
  base_url: https://glitchmentalmx.contacto-fbf.workers.dev
  auth_endpoint: auth

site_url: https://glitchmental.com
display_url: https://glitchmental.com

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

slug:
  encoding: "unicode"
  clean_accents: true
  sanitize_replacement: "-"

locale: "es"

collections:
  - name: "posts"
    label: "Artículos"
    label_singular: "Artículo"
    folder: "src/content/posts"
    create: true
    slug: "{{title}}"
    identifier_field: title
    sortable_fields: ["pubDate", "title"]
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - label: "Categoría"
        name: "category"
        widget: "select"
        options: ["Inteligencia Artificial", "Cultura Digital", "Tendencias Digitales", "Tecnología de Consumo"]
      - { label: "Fecha de publicación", name: "pubDate", widget: "datetime", default: "{{now}}" }
      - { label: "Fecha de actualización", name: "updatedDate", widget: "datetime", required: false }
      - { label: "Descripción (para tarjetas y buscadores)", name: "description", widget: "text" }
      - { label: "Imagen principal", name: "heroImage", widget: "image" }
      - { label: "Texto alternativo de la imagen principal", name: "heroImageAlt", widget: "string" }
      - { label: "Borrador (no publicar todavía)", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "Cuerpo del artículo", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Páginas fijas"
    label_singular: "Página"
    files:
      - name: "acerca-de"
        label: "Acerca de"
        file: "src/content/pages/acerca-de.md"
        fields: &pageFields
          - { label: "Título (pestaña del navegador)", name: "title", widget: "string" }
          - { label: "Descripción (buscadores)", name: "description", widget: "text" }
          - { label: "Etiqueta pequeña arriba del título", name: "eyebrow", widget: "string" }
          - { label: "Título grande", name: "headline", widget: "string" }
          - { label: "Bajada / subtítulo", name: "dek", widget: "text", required: false }
          - { label: "Cuerpo de la página", name: "body", widget: "markdown" }
      - name: "contacto"
        label: "Contacto"
        file: "src/content/pages/contacto.md"
        fields: *pageFields
      - name: "suscribete"
        label: "Suscríbete"
        file: "src/content/pages/suscribete.md"
        fields: *pageFields
      - name: "colabora"
        label: "Colabora"
        file: "src/content/pages/colabora.md"
        fields: *pageFields
      - name: "politica-de-privacidad"
        label: "Política de Privacidad"
        file: "src/content/pages/politica-de-privacidad.md"
        fields: *pageFields
      - name: "aviso-legal"
        label: "Aviso Legal"
        file: "src/content/pages/aviso-legal-y-condiciones-de-uso.md"
        fields: *pageFields
      - name: "gracias"
        label: "Gracias (bienvenida a suscriptores)"
        file: "src/content/pages/gracias.md"
        fields: *pageFields

  - name: "insights_visuales"
    label: "Insights Visuales"
    label_singular: "Insight visual"
    folder: "src/content/insights"
    create: true
    slug: "{{titulo}}"
    identifier_field: titulo
    sortable_fields: ["date", "titulo"]
    fields:
      - { label: "Título", name: "titulo", widget: "string" }
      - { label: "Resumen", name: "resumen", widget: "text" }
      - { label: "Imagen", name: "imagen", widget: "image" }
      - { label: "Texto alternativo de la imagen", name: "imagenAlt", widget: "string", required: false }
      - { label: "Enlace al artículo relacionado (ej. /articulos/mi-articulo/)", name: "enlace", widget: "string", required: false }
      - { label: "Fecha (el más reciente es el que aparece en el home)", name: "date", widget: "datetime", default: "{{now}}" }
      - { label: "Borrador (no publicar todavía)", name: "draft", widget: "boolean", default: false, required: false }
      - label: "Categoría (para el enlace de la tarjeta en /insights-visuales/)"
        name: "categoria"
        widget: "select"
        required: false
        options: ["Inteligencia Artificial", "Narrativa de la IA", "Sistemas Autónomos", "IA Agéntica", "Futuro del Trabajo", "Cultura Digital", "Psicología Digital", "Tecnología de Consumo", "Tendencias Digitales"]
      - label: "Punchline (solo para el home y material de RS — no aparece en /insights-visuales/)"
        name: "punchline"
        widget: "string"
        required: false

  - name: "indice_glitchmentalmx"
    label: "Índice glitchMentalMX"
    label_singular: "Edición mensual"
    files:
      - name: "indice-actual"
        label: "Edición del mes actual"
        file: "src/content/indice/actual.json"
        format: "json"
        fields:
          - { label: "Mes (ej. Agosto 2026)", name: "mes", widget: "string" }
          - label: "Ranking general (20 tecnologías, de mayor a menor puntaje)"
            name: "ranking"
            widget: "list"
            summary: "{{fields.pos}}. {{fields.nombre}} — {{fields.pts}} pts"
            fields:
              - { label: "Posición", name: "pos", widget: "number", value_type: "int" }
              - { label: "Nombre", name: "nombre", widget: "string" }
              - { label: "Puntos", name: "pts", widget: "number", value_type: "int" }
          - label: "Destacados del Top 5"
            name: "destacados"
            widget: "list"
            summary: "{{fields.pos}}. {{fields.nombre}}"
            fields:
              - { label: "Posición", name: "pos", widget: "number", value_type: "int" }
              - { label: "Nombre", name: "nombre", widget: "string" }
              - { label: "Análisis", name: "texto", widget: "text" }
          - { label: "Qué sube (vs. mes anterior)", name: "sube", widget: "text" }
          - { label: "Qué baja (vs. mes anterior)", name: "baja", widget: "text" }
          - { label: "Insight editorial del mes", name: "insight", widget: "text" }

  - name: "dato_incomodo"
    label: "Dato Incómodo"
    label_singular: "Dato incómodo"
    folder: "src/content/dato-incomodo"
    create: true
    slug: "dato-{{uuid_short}}"
    identifier_field: resumen
    sortable_fields: ["date", "titulo"]
    fields:
      - { label: "Título (interno, siempre dice 'Dato Incómodo')", name: "titulo", widget: "string", default: "Dato Incómodo" }
      - { label: "El dato (texto que se muestra)", name: "resumen", widget: "text" }
      - { label: "Imagen", name: "imagen", widget: "image" }
      - { label: "Texto alternativo de la imagen", name: "imagenAlt", widget: "string", required: false }
      - { label: "Fecha (el más reciente es el que aparece primero)", name: "date", widget: "datetime", default: "{{now}}" }
      - { label: "Borrador (no publicar todavía)", name: "draft", widget: "boolean", default: false, required: false }
